name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' -print0
          )
          ((${#scripts[@]} > 0))
          for script in "${scripts[@]}"; do
            bash -n "${script}"
          done

      - name: Run ShellCheck
        shell: bash
        run: |
          mapfile -d '' scripts < <(
            find . -type f -name '*.sh' -print0
          )
          shellcheck --severity=warning "${scripts[@]}"

      - name: Check repository privacy
        run: tests/privacy_check.sh

      - name: Run safe smoke checks
        run: tests/smoke.sh

      - name: Test resource profiles
        run: bash tests/test_profiles.sh

      - name: Test CPU runtime configuration
        run: tests/test_cpu_runtime.sh

      - name: Test guarded service startup
        run: tests/test_service_startup.sh

      - name: Test UI asset modes
        run: tests/test_ui_assets.sh

      - name: Test staged source activation and rollback
        run: tests/test_staged_source.sh

      - name: Test detached download manager with fakes
        run: tests/test_download_model.sh

      - name: Test model checksum verification with a fake Hub
        run: bash tests/test_model_verify.sh

      - name: Test mirror verification with fixtures
        run: tests/test_mirror_model.sh

  upstream-contract:
    name: Upstream CPU contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reproduce legacy failure and validate sanitized startup
        env:
          COLIBRI_CONTRACT_REPETITIONS: "100"
        run: tests/test_upstream_cpu_contract.sh

  repeat-regressions:
    name: Repeat startup regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run critical fixture tests 100 times
        shell: bash
        run: |
          for ((iteration = 1; iteration <= 100; iteration++)); do
            tests/test_cpu_runtime.sh >/dev/null
            tests/test_service_startup.sh >/dev/null
            bash tests/test_profiles.sh >/dev/null
            bash tests/test_model_verify.sh >/dev/null
          done
          printf 'Critical startup/profile/model regressions passed 100 repetitions.\n'
